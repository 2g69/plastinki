<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пластинки</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пластинки">
<meta name="theme-color" content="#2C1C86">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen player column — queue tab, title, record carousel (bleeds to edges), scrub rail, transport.
   Background tokens are re-tinted from the current cover. */
@property --bg{syntax:'<color>';inherits:true;initial-value:#2C1C86}
@property --bg-deep{syntax:'<color>';inherits:true;initial-value:#1B0F5E}
@property --text{syntax:'<color>';inherits:true;initial-value:#ECE8FF}
@property --muted{syntax:'<color>';inherits:true;initial-value:#A99FE6}
@property --fill{syntax:'<color>';inherits:true;initial-value:#7A5CFF}
:root{
  --bg:#2C1C86;
  --bg-deep:#1B0F5E;
  --vinyl:#09070F;
  --groove:#18142A;
  --text:#ECE8FF;
  --muted:#A99FE6;
  --fill:#7A5CFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --D:260px;
  color-scheme:dark;
  transition:--bg 1.1s ease,--bg-deep 1.1s ease,--text 1.1s ease,--muted 1.1s ease,--fill 1.1s ease;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(130% 75% at 50% 42%, var(--bg) 35%, var(--bg-deep) 100%);
  color:var(--text);font-family:var(--f-body);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:12px}

.app{
  height:100%;max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;align-items:stretch;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 18px;
  gap:6px;
}

/* top */
.top{display:flex;justify-content:center;padding-top:6px}
.queue-btn{width:64px;height:44px;display:grid;place-items:center;border-radius:14px}
.queue-btn svg{width:40px;height:30px}
.queue-btn:active{transform:scale(.94)}

.meta{text-align:center;display:flex;flex-direction:column;gap:6px;padding:6px 8px 0;min-width:0}
.title{
  font-family:var(--f-display);font-weight:700;text-transform:uppercase;
  font-size:clamp(17px,5.4vw,23px);letter-spacing:.02em;line-height:1.15;margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.artist{font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;border:1px solid var(--muted);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}

/* stage + records */
.stage{
  position:relative;flex:1 1 auto;min-height:200px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  overflow:hidden;touch-action:none;-webkit-touch-callout:none;
}
.rec{position:absolute;left:50%;top:50%;width:var(--D);height:var(--D);will-change:transform;pointer-events:none}
.rec:not(.center){cursor:pointer}
.spin{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle, transparent 0 60.5%, rgba(255,255,255,.05) 61% 61.6%, transparent 62.2% 76%, rgba(255,255,255,.045) 76.5% 77.1%, transparent 77.7% 96.5%, #000 97%),
    repeating-radial-gradient(circle, var(--vinyl) 0 1.5px, var(--groove) 1.5px 2.3px);
  box-shadow:0 22px 44px rgba(0,0,0,.45);
  transition:scale .18s ease;
}
.held .rec.center .spin{scale:.985}
.lp .rec.center .spin{scale:.95}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(236,232,255,.22);left:78%;top:28%}
.dust.b{left:24%;top:70%;width:2px;height:2px;background:rgba(236,232,255,.16)}
.label{
  position:absolute;inset:29%;border-radius:50%;overflow:hidden;
  background:hsl(var(--h,252) 72% 46%);background-size:cover;background-position:center;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:15% 14% 13%;text-align:center;color:rgba(255,255,255,.88);
  box-shadow:inset 0 0 0 calc(var(--D) * .006) rgba(0,0,0,.35);
}
.l-title{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:calc(var(--D) * .036);line-height:1.15;
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.l-rpm{font-family:var(--f-mono);font-size:calc(var(--D) * .03);opacity:.8;letter-spacing:.06em}
.label.has-cover .l-title,.label.has-cover .l-rpm{visibility:hidden}
.hole{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:var(--vinyl);
  box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.sheen{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 210deg, transparent 0 7%, rgba(225,220,255,.14) 12%, transparent 19% 50%, rgba(225,220,255,.10) 62%, transparent 69%);
  -webkit-mask:radial-gradient(circle, transparent 0 29.5%, #000 30.5% 96%, transparent 97%);
          mask:radial-gradient(circle, transparent 0 29.5%, #000 30.5% 96%, transparent 97%);
}
.empty{
  position:absolute;left:50%;top:50%;width:var(--D);height:var(--D);transform:translate(-50%,-50%);
  border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;text-align:center;
  font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.4;color:var(--text);padding:20%;
}
.pill{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:50;
  font-family:var(--f-mono);font-size:13px;background:var(--vinyl);color:var(--text);
  padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .15s;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.held .pill{opacity:1}
.pill b{color:var(--muted);font-weight:500;margin-left:8px}

/* scrub rail */
.scrubwrap{padding:34px 12px 0}
.scrub{position:relative;height:40px;touch-action:none;cursor:pointer;border-radius:8px}
.rail{position:absolute;left:0;right:0;top:50%;height:9px;margin-top:-4.5px;border-radius:99px;background:var(--vinyl);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--fill)}
.thumb{position:absolute;top:50%;width:4px;height:28px;margin:-14px 0 0 -2px;border-radius:3px;background:var(--text);left:0}
.times{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px}

/* transport */
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 8px 4px}
.ctl{width:56px;height:56px;display:grid;place-items:center;justify-self:center;position:relative;opacity:.45;transition:opacity .15s}
.ctl svg{width:34px;height:34px}
.ctl[aria-pressed="true"]{opacity:1}
.ctl[aria-pressed="true"]::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--text)}
.play{width:84px;height:84px;border-radius:50%;background:var(--vinyl);display:grid;place-items:center;color:var(--text);
  box-shadow:0 10px 26px rgba(0,0,0,.4), inset 0 0 0 3px var(--text);transition:transform .1s}
.play:active,.ctl:active{transform:scale(.93)}
.play svg{width:34px;height:34px}
.hint{text-align:center;font-size:12px;line-height:1.5;color:var(--muted);padding:10px 12px 0;min-height:30px;text-wrap:balance;transition:opacity .4s}

/* queue sheet */
.sheet-wrap{position:fixed;inset:0;z-index:100;visibility:hidden;transition:visibility 0s .3s}
.sheet-wrap.open{visibility:visible;transition:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.open .backdrop{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;max-height:82%;
  background:var(--bg-deep);border-radius:24px 24px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -10px 40px rgba(0,0,0,.4);
}
.open .sheet{transform:none}
.sheet header{display:flex;align-items:center;gap:10px;padding:18px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.02em}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:1}
.q-tip{margin:0;padding:0 max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));font-size:12.5px;color:var(--muted)}
.btn{padding:9px 14px;border-radius:99px;background:var(--text);color:var(--bg-deep);font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--muted)}
.list{list-style:none;margin:0;padding:0 0 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.list li{display:flex;align-items:center;gap:2px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.list li.li-cur{background:color-mix(in srgb, var(--fill) 16%, transparent);border-radius:16px}
.q-cover{flex:none;position:relative;width:52px;height:52px;display:grid;place-items:center;border-radius:14px}
.q-cover .badge{position:absolute;right:2px;bottom:3px;width:17px;height:17px;border-radius:50%;background:var(--text);color:var(--bg-deep);
  font-size:13px;font-weight:700;line-height:17px;text-align:center}
.q-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 6px;border-radius:14px}
.q-main:active{background:rgba(255,255,255,.06)}
.mini{flex:none;width:40px;height:40px;border-radius:50%;background:repeating-radial-gradient(circle,var(--vinyl) 0 1px,var(--groove) 1px 1.8px);position:relative}
.mini i{position:absolute;inset:28%;border-radius:50%;background:hsl(var(--h,252) 72% 46%);background-size:cover;background-position:center}
.mini i::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--vinyl)}
.li-cur.playing .mini{animation:rot 1.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.q-text{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.q-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-artist{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-dur{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-del{flex:none;min-width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:0 8px}
.q-del svg{width:18px;height:18px}
.q-del.confirm{color:#FFB4C8;background:rgba(255,120,160,.14);font-weight:600}
.q-empty{padding:28px 20px;color:var(--muted);text-align:center;font-size:14px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-20px);z-index:200;
  background:var(--text);color:var(--bg-deep);font-weight:600;font-size:14px;padding:9px 16px;border-radius:99px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  :root{transition:none}
  .sheet,.backdrop,.toast{transition:none}
  .li-cur.playing .mini{animation:none}
}
</style>
</head>
<body>


<div class="app">
  <div class="top">
    <button class="queue-btn" id="queueBtn" aria-label="Открыть очередь">
      <svg viewBox="0 0 40 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
        <rect x="4" y="3" width="32" height="7" rx="3.5"/><path d="M4 18h32M4 26h32"/>
      </svg>
    </button>
  </div>

  <div class="meta">
    <h1 class="title" id="title">Пластинки</h1>
    <div class="artist" id="artist">&nbsp;</div>
  </div>

  <div class="stage" id="stage" tabindex="0" aria-label="Пластинка. Крути — перемотка, тап — пауза, удержание — обложка, тап по соседней — другой трек. Стрелки влево и вправо меняют трек.">
    <div class="pill" id="pill">0:00<b>+0:00</b></div>
    <button class="empty" id="emptyBtn" hidden>Загрузить<br>mp3</button>
  </div>

  <div class="scrubwrap">
    <div class="scrub" id="bar" role="slider" tabindex="0" aria-label="Позиция в треке" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="rail"><div class="fill" id="fill"></div></div>
      <div class="thumb" id="thumb"></div>
    </div>
    <div class="times"><span id="tCur">0:00</span><span id="tLeft">−0:00</span></div>
  </div>

  <div class="controls">
    <button class="ctl" id="shuffleBtn" aria-label="Перемешать очередь" aria-pressed="false">
      <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h5c6 0 8 16 14 16h7M3 25h5c2.6 0 4.3-3 5.8-6.5M19.5 13.5C21 11 22.5 9 25 9h4"/>
        <path d="M25 5l4 4-4 4M25 21l4 4-4 4"/>
      </svg>
    </button>
    <button class="play" id="playBtn" aria-label="Играть">
      <svg viewBox="0 0 34 34" id="playIcon" fill="currentColor"></svg>
    </button>
    <button class="ctl" id="repeatBtn" aria-label="Повторять текущий трек" aria-pressed="false">
      <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 26H9a5 5 0 0 1-5-5v-8a5 5 0 0 1 5-5h16a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-1"/>
        <path d="M21 22l-4 4 4 4"/>
        <path d="M15.5 13.5l2-1.5v8" stroke-width="2.4"/>
      </svg>
    </button>
  </div>
  <div class="hint" id="hint">Крути пластинку — перемотка. Удерживай — сменить обложку. Тап по соседней — другой трек.</div>
</div>

<div class="sheet-wrap" id="sheet" aria-hidden="true">
  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" role="dialog" aria-label="Очередь">
    <header>
      <h2>Очередь</h2>
      <span class="count" id="qCount"></span>
      <button class="btn" id="addBtn">+ mp3</button>
      <button class="btn ghost" id="closeBtn">Готово</button>
    </header>
    <p class="q-tip">Нажми на мини-пластинку слева, чтобы поставить свою обложку.</p>
    <ol class="list" id="qList"></ol>
  </section>
</div>

<input type="file" id="file" accept="audio/mpeg,audio/mp3,.mp3,audio/*" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="coverFile" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const SEC_PER_TURN = 15;          // один оборот пальцем = 15 секунд трека
const RPM_DEG = 200;              // 33⅓ об/мин = 200°/с
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const stage = $('stage'), bar = $('bar');
const audio = new Audio();
audio.preload = 'auto';

let library = [];   // {id,title,artist,blob,cover,coverUrl,color,duration,hue,demo,added}
let order = [];
let cur = -1;
let currentId = null, currentUrl = null;
let shuffle = false, repeat = false;
let viewPos = 0, omega = 0;
let holding = false, resumeAfter = false, coast = null, motorOn = false, handoff = null;
let scrubT = 0, scrubStart = 0;
let D = 260, spacing = 250;
const rot = new Map();
const els = new Map();

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('plastinki:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('plastinki:'+k, JSON.stringify(v)); }catch(e){} }
};
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const DB = {
  db: null,
  async open(){
    try{
      const r = indexedDB.open('plastinki', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath: 'id' });
      this.db = await reqP(r);
    }catch(e){ this.db = null; }
  },
  os(mode){ return this.db.transaction('tracks', mode).objectStore('tracks'); },
  async all(){ if(!this.db) return []; try{ return await reqP(this.os('readonly').getAll()); }catch(e){ return []; } },
  async put(t){ if(!this.db) return false; try{ await reqP(this.os('readwrite').put(t)); return true; }catch(e){ return false; } },
  async del(id){ if(!this.db) return; try{ await reqP(this.os('readwrite').delete(id)); }catch(e){} }
};

/* ---------- helpers ---------- */
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hueOf = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) >>> 0; return 228 + h % 56; };
const byId = id => library.find(t => t.id === id);
const track = () => (cur >= 0 && cur < order.length) ? byId(order[cur]) : null;
const dur = () => (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : (track()?.duration || 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
function plural(n, f){ const a = n % 100, b = n % 10; return (a > 10 && a < 20) ? f[2] : b === 1 ? f[0] : (b >= 2 && b <= 4) ? f[1] : f[2]; }

/* ---------- vinyl sound engine ----------
   While the finger holds the record, the decoded track is played from a buffer at a variable
   (also negative) speed that chases the record's position, plus surface crackle. */
const engine = {
  ctx: null, node: null, buf: null, bufSR: 22050, bufId: null,
  pos: 0, rate: 0, target: 0, mode: 'off', gain: 0, gainTarget: 0,
  lp: 0, nb: 0, click: 0, hx: 0, hy: 0,
  ensure(){
    try{
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
        this.ctx = new AC();
        this.node = this.ctx.createScriptProcessor(1024, 1, 1);
        this.node.onaudioprocess = e => this.process(e.outputBuffer.getChannelData(0));
        this.node.connect(this.ctx.destination);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
      return true;
    }catch(e){ return false; }
  },
  ready(){ return !!(this.ctx && this.buf && this.bufId === currentId); },
  process(out){
    const n = out.length;
    if (this.gainTarget === 0 && this.gain < 1e-4){ out.fill(0); this.gain = 0; this.lp = 0; this.hx = 0; this.hy = 0; return; }
    const sr = this.ctx.sampleRate, dt = 1 / sr;
    const rs = 1 - Math.exp(-dt / 0.012), ms = 1 - Math.exp(-dt / 0.07), gs = 1 - Math.exp(-dt / 0.025);
    const data = this.ready() ? this.buf : null, bsr = this.bufSR, len = data ? data.length : 0, maxT = dur();
    for (let i = 0; i < n; i++){
      let want = 0, k = rs;
      if (this.mode === 'follow') want = clamp((this.target - this.pos) * 28, -60, 60);
      else if (this.mode === 'motor'){ want = 1; k = ms; }
      this.rate += (want - this.rate) * k;
      this.pos += this.rate * dt;

function decodeText(enc, b){

    else if (enc === 2) s = new TextDecoder('utf-16be').decode(b);

    return s.replace(/^﻿/, '').split('\0').filter(Boolean)[0]?.trim() || null;
  }catch(e){ return null; }
}
function readPic(d, v22){

async function readTags(file){

    const ver = h[3], flags = h[5];
    const size = (h[6]&0x7f)<<21 | (h[7]&0x7f)<<14 | (h[8]&0x7f)<<7 | (h[9]&0x7f);
    let buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    if ((flags & 0x80) && ver < 4){ const o = []; for (let i = 0; i < buf.length; i++){ o.push(buf[i]); if (buf[i] === 0xFF && buf[i+1] === 0) i++; } buf = Uint8Array.from(o); }

        p += 6 + sz;
      }
    } else {
      while (p + 10 <= buf.length){
        const id = String.fromCharCode(buf[p], buf[p+1], buf[p+2], buf[p+3]);
        const sz = ver === 4 ? ss(p + 4) : be32(p + 4);
        if (!/^[A-Z0-9]{4}$/.test(id) || sz <= 0) break;
        const d = buf.subarray(p + 10, p + 10 + sz);
        if (id === 'TIT2') out.title = decodeText(d[0], d.subarray(1));

function probeDuration(blob){

function wav(f, sr){
  const n = f.length, b = new ArrayBuffer(44 + n*2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);

}
function synth(bpm, chords, bars, seed){

  let lp = 0, peak = 0;
  for (let i = 0; i < n; i++){
    const t = i / sr;

    const kick = Math.sin(TAU*(45*tb + 80*(1 - Math.exp(-28*tb))/28)) * Math.exp(-tb*7) * 0.9;
    const off = tb - beat / 2;
    const hat = off >= 0 ? rand() * Math.exp(-off*55) * 0.16 : 0;
    const bf = mtof(ch[0] - 12), ph = (bf*t) % 1;
    const bass = (2*Math.abs(2*ph - 1) - 1) * 0.34 * Math.exp(-t8*4);
    let pad = 0; for (const m of ch){ const f = mtof(m); pad += ((f*t) % 1)*2 - 1 + ((f*1.004*t) % 1)*2 - 1; }

}

/* ---------- order / playback ---------- */
function rebuildOrder(keepId){
  const ids = library.map(t => t.id);
  if (shuffle){
    const rest = ids.filter(i => i !== keepId);
    for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    order = keepId && ids.includes(keepId) ? [keepId, ...rest] : rest;
  } else order = ids;
  cur = order.length ? Math.max(0, order.indexOf(keepId)) : -1;
  viewPos = Math.max(0, cur);
}
function cancelHandoff(){ clearTimeout(handoff); handoff = null; motorOn = false; }
function abortScrub(){
  holding = false; coast = null; resumeAfter = false; cancelHandoff();
  stage.classList.remove('held');
  engine.gainTarget = 0;
}
function loadCurrent(autoplay){
  const t = track();
  if (!t){
    abortScrub(); audio.pause(); audio.removeAttribute('src'); audio.load();
    if (currentUrl) URL.revokeObjectURL(currentUrl); currentUrl = null; currentId = null;
    applyTheme(null); updateMeta(); return;
  }
  if (currentId !== t.id){
    abortScrub();
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(t.blob);
    audio.src = currentUrl; currentId = t.id; audio.loop = repeat;
    scheduleDecode(t);
  }
  applyTheme(t);
  updateMeta();
  if (autoplay) play();
}
function play(){
  if (!track()) return;
  const p = audio.play();
  if (p && p.catch) p.catch(() => { if (motorOn){ cancelHandoff(); engine.gainTarget = 0; updatePlayBtn(); } });
}
function go(i, autoplay){
  if (!order.length) return;
  i = clamp(i, 0, order.length - 1);
  if (i === cur && currentId === order[i]){ if (autoplay && audio.paused) play(); return; }
  cur = i; loadCurrent(autoplay); renderQueue();
}
function next(auto){
  if (cur < order.length - 1) go(cur + 1, auto ? true : isPlayingUI());
  else if (auto){ go(0, false); audio.currentTime = 0; }
  else go(0, isPlayingUI());
}
function prev(){
  if (audio.currentTime > 3 || cur === 0) audio.currentTime = 0;
  else go(cur - 1, isPlayingUI());
}
function togglePlay(){
  if (!track()) return;
  if (motorOn){ cancelHandoff(); engine.gainTarget = 0; audio.pause(); updatePlayBtn(); return; }
  audio.paused ? play() : audio.pause();
}

  $('pill').innerHTML = fmt(scrubT) + '<b>' + (delta >= 0 ? '+' : '−') + fmt(Math.abs(delta)) + '</b>';
}
function hideHint(){ if (store.get('hintSeen', false)) return; store.set('hintSeen', true); $('hint').style.opacity = '0'; }
function startHold(){
  if (holding){ coast = null; return; }
  const wasMotor = motorOn;
  cancelHandoff();
  holding = true; coast = null;
  resumeAfter = !audio.paused || wasMotor;
  scrubStart = scrubT = (wasMotor && engine.ready()) ? engine.pos : (audio.currentTime || 0);
  if (!audio.paused) audio.pause();
  if (engine.ensure()){
    if (!wasMotor){ engine.pos = scrubT; engine.rate = resumeAfter ? 1 : 0; }
    engine.target = scrubT; engine.mode = 'follow'; engine.gainTarget = 1;
    if (resumeAfter) engine.gain = 1;
  }
  stage.classList.add('held');
  updatePlayBtn();
}
function endHold(){
  if (!holding) return;
  holding = false; coast = null; stage.classList.remove('held');
  clearTimeout(seekTimer);
  const useEngine = engine.ready();
  if (resumeAfter){
    resumeAfter = false;
    if (useEngine){
      motorOn = true; engine.mode = 'motor';
      handoff = setTimeout(() => {
        try{ audio.currentTime = Math.min(dur(), engine.pos + 0.06); }catch(e){}
        play();
        handoff = setTimeout(() => { if (motorOn){ motorOn = false; engine.gainTarget = 0; updatePlayBtn(); } }, 1500);
      }, 140);
    } else {
      try{ audio.currentTime = scrubT; }catch(e){}
      engine.gainTarget = 0; play();
    }
  } else {
    try{ audio.currentTime = scrubT; }catch(e){}
    handoff = setTimeout(() => { handoff = null; engine.gainTarget = 0; }, 140);
  }
  updatePlayBtn(); updateMediaPos();
}
function stepCoast(dt){
  if (!holding || !coast) return;
  const v = coast.v, sv = Math.sign(v);
  coast.v = v - sv * Math.min(Math.abs(v), (Math.abs(v) * 1.6 + 3) * dt);
  const da = coast.v * dt;
  const id = order[cur];
  rot.set(id, (rot.get(id) || 0) + da * 180 / Math.PI);
  const before = scrubT;
  scrubTo(scrubT + da / TAU * SEC_PER_TURN);
  if (scrubT === before && da !== 0) coast.v = 0;   // hit start or end
  if (Math.abs(coast.v) < 0.35){ coast = null; endHold(); }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const diff = cur - viewPos;
  viewPos = Math.abs(diff) < 0.001 ? Math.max(0, cur) : viewPos + diff * (1 - Math.pow(0.0006, dt));
  stepCoast(dt);
  const t = track();
  const target = (t && (!audio.paused || motorOn) && !holding) ? RPM_DEG : 0;
  omega += (target - omega) * (1 - Math.pow(0.02, dt));
  if (t && !holding && Math.abs(omega) > 0.05) rot.set(t.id, (rot.get(t.id) || 0) + omega * dt);
  layout();
  updateProgress();
  requestAnimationFrame(frame);
}

/* ---------- record gestures ---------- */
let g = null;
stage.addEventListener('pointerdown', e => {
  if (!order.length || g) return;
  if (e.button !== undefined && e.button !== 0) return;
  engine.ensure();
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  const r = stage.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const onDisc = Math.hypot(dx, dy) <= D / 2 && Math.abs(viewPos - cur) < 0.15;
  const now = performance.now();
  g = { id: e.pointerId, mode: onDisc ? 'disc' : 'tap', x0: e.clientX, y0: e.clientY, t0: now, cx, cy, side: dx,
        moved: false, lastA: Math.atan2(dy, dx), acc: 0, baseT: 0, samples: [{ t: now, acc: 0 }], lastMove: now, lp: null };
  if (onDisc && holding){            // caught a coasting record
    coast = null; g.moved = true; g.baseT = scrubT;
  } else if (!onDisc && holding){
    endHold();
  } else if (onDisc){
    g.lp = setTimeout(() => { if (g && !g.moved) stage.classList.add('lp'); }, 550);
  }
});
stage.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id || g.mode !== 'disc') return;
  const mx = e.clientX - g.x0, my = e.clientY - g.y0;
  if (!g.moved && Math.hypot(mx, my) > 6){
    g.moved = true; clearTimeout(g.lp); stage.classList.remove('lp');
    startHold(); g.baseT = scrubT;
  }
  if (!g.moved) return;
  const dx = e.clientX - g.cx, dy = e.clientY - g.cy;
  const a = Math.atan2(dy, dx);
  if (Math.hypot(dx, dy) > 16){
    let da = a - g.lastA;
    if (da > Math.PI) da -= TAU; else if (da < -Math.PI) da += TAU;
    g.acc += da;
    const id = order[cur];
    rot.set(id, (rot.get(id) || 0) + da * 180 / Math.PI);
    const want = g.baseT + g.acc / TAU * SEC_PER_TURN;
    scrubTo(want);
    if (scrubT !== want) g.baseT = scrubT - g.acc / TAU * SEC_PER_TURN;   // don't wind up past the ends
    const now = performance.now();
    g.samples.push({ t: now, acc: g.acc });
    while (g.samples.length > 2 && now - g.samples[0].t > 110) g.samples.shift();
    g.lastMove = now;
  }
  g.lastA = a;
});
function finish(e, cancelled){
  if (!g || e.pointerId !== g.id) return;
  clearTimeout(g.lp); stage.classList.remove('lp');
  const now = performance.now(), mx = e.clientX - g.x0, my = e.clientY - g.y0;
  if (g.mode === 'disc'){
    if (!g.moved){
      if (!cancelled){ if (now - g.t0 > 550) pickCover(currentId); else togglePlay(); }
    } else {
      let v = 0;
      if (!cancelled && now - g.lastMove < 60 && g.samples.length > 1){
        const s0 = g.samples[0], dts = (now - s0.t) / 1000;
        if (dts > 0.015) v = (g.acc - s0.acc) / dts;
      }
      if (holding && Math.abs(v) > 2.5) coast = { v: clamp(v, -45, 45) };
      else endHold();
      if (Math.abs(g.acc) > 0.5) hideHint();
    }
  } else if (!cancelled && Math.hypot(mx, my) < 14){
    const pl = isPlayingUI();
    if (g.side > D / 2) go(cur + 1, pl);
    else if (g.side < -D / 2) go(cur - 1, pl);
  }
  g = null;
}
stage.addEventListener('pointerup', e => finish(e, false));
stage.addEventListener('pointercancel', e => finish(e, true));
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ e.preventDefault(); go(cur + 1, isPlayingUI()); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(cur - 1, isPlayingUI()); }
  else if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); togglePlay(); }
});
$('emptyBtn').addEventListener('click', e => { e.stopPropagation(); $('file').click(); });
$('emptyBtn').addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- progress bar ---------- */
function barTime(x){ const r = bar.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1) * dur(); }
bar.addEventListener('pointerdown', e => {
  if (!track() || holding) return;
  barDrag = true; try{ bar.setPointerCapture(e.pointerId); }catch(err){}
  barT = barTime(e.clientX);
});
bar.addEventListener('pointermove', e => { if (barDrag) barT = barTime(e.clientX); });
bar.addEventListener('pointerup', () => { if (!barDrag) return; barDrag = false; try{ audio.currentTime = barT; }catch(err){} updateMediaPos(); });
bar.addEventListener('pointercancel', () => { barDrag = false; });
bar.addEventListener('keydown', e => {
  const step = e.shiftKey ? 15 : 5;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); audio.currentTime = Math.min(dur(), audio.currentTime + step); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - step); }
});

/* ---------- transport ---------- */
$('playBtn').addEventListener('click', () => { engine.ensure(); togglePlay(); });
$('shuffleBtn').addEventListener('click', () => {
  shuffle = !shuffle; store.set('shuffle', shuffle);
  $('shuffleBtn').setAttribute('aria-pressed', shuffle);
  rebuildOrder(currentId); resetRecords(); renderQueue();
  toast(shuffle ? 'Очередь перемешана' : 'Исходный порядок');
});
$('repeatBtn').addEventListener('click', () => {
  repeat = !repeat; audio.loop = repeat; store.set('repeat', repeat);
  $('repeatBtn').setAttribute('aria-pressed', repeat);
  toast(repeat ? 'Трек повторяется' : 'Повтор выключен');
});

/* ---------- covers ---------- */
let coverFor = null;
function pickCover(id){ if (!id) return; coverFor = id; $('coverFile').click(); }
$('coverFile').addEventListener('change', async () => {
  const f = $('coverFile').files[0]; $('coverFile').value = '';
  const t = byId(coverFor); coverFor = null;
  if (!f || !t) return;
  try{
    const { blob, color } = await processCover(f);
    if (t.coverUrl) URL.revokeObjectURL(t.coverUrl);
    t.cover = blob; t.coverUrl = URL.createObjectURL(blob); t.color = color;
    if (!t.demo) await DB.put(strip(t));
    resetRecords(); renderQueue();
    if (t.id === currentId){ applyTheme(t); updateMeta(); }
    toast('Обложка обновлена');
  }catch(e){ toast('Не получилось открыть картинку — попробуй JPG или PNG'); }
});

/* ---------- queue sheet ---------- */
function openSheet(){ renderQueue(); $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false'); setTimeout(() => $('closeBtn').focus(), 50);
  const li = $('qList').querySelector('.li-cur'); if (li) li.scrollIntoView({ block: 'center' }); }
function closeSheet(){ $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true'); $('queueBtn').focus(); }
$('queueBtn').addEventListener('click', openSheet);
$('closeBtn').addEventListener('click', closeSheet);
$('backdrop').addEventListener('click', closeSheet);
$('addBtn').addEventListener('click', () => $('file').click());
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet();
  else if (e.key === ' ' && e.target === document.body){ e.preventDefault(); togglePlay(); }
});
const DEL_ICON = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>';
function renderQueue(){
  const list = $('qList'); list.innerHTML = '';
  $('qCount').textContent = order.length ? order.length + ' ' + plural(order.length, ['трек','трека','треков']) : '';
  if (!order.length){ const li = document.createElement('li'); li.className = 'q-empty'; li.textContent = 'Пока пусто. Нажми «+ mp3» и выбери файлы.'; list.append(li); return; }
  order.forEach((id, i) => {
    const t = byId(id); if (!t) return;
    const li = document.createElement('li');
    if (i === cur){ li.className = 'li-cur'; if (isPlayingUI()) li.classList.add('playing'); }
    const cv = document.createElement('button'); cv.className = 'q-cover'; cv.dataset.id = id;
    cv.setAttribute('aria-label', 'Обложка для «' + t.title + '»');
    const mini = document.createElement('span'); mini.className = 'mini';
    const lab = document.createElement('i'); lab.style.setProperty('--h', t.hue); if (t.coverUrl) lab.style.backgroundImage = 'url("' + t.coverUrl + '")';
    mini.append(lab);
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = '+';
    cv.append(mini, badge);
    const main = document.createElement('button'); main.className = 'q-main'; main.dataset.i = i;
    const txt = document.createElement('span'); txt.className = 'q-text';
    const a = document.createElement('span'); a.className = 'q-title'; a.textContent = t.title;
    const b = document.createElement('span'); b.className = 'q-artist'; b.textContent = (t.artist || 'Неизвестный исполнитель') + (t.demo ? ' · демо' : '');
    txt.append(a, b);
    const du = document.createElement('span'); du.className = 'q-dur'; du.textContent = t.duration ? fmt(t.duration) : '';
    main.append(txt, du);
    const del = document.createElement('button'); del.className = 'q-del'; del.dataset.id = id; del.innerHTML = DEL_ICON;
    del.setAttribute('aria-label', 'Удалить «' + t.title + '»');
    li.append(cv, main, del); list.append(li);
  });
}
$('qList').addEventListener('click', e => {
  const cv = e.target.closest('.q-cover');
  if (cv){ pickCover(cv.dataset.id); return; }
  const del = e.target.closest('.q-del');
  if (del){
    if (del.classList.contains('confirm')){ removeTrack(del.dataset.id); return; }
    del.classList.add('confirm'); del.textContent = 'Удалить?';
    setTimeout(() => { if (del.isConnected){ del.classList.remove('confirm'); del.innerHTML = DEL_ICON; } }, 3000);
    return;
  }
  const m = e.target.closest('.q-main');
  if (m){ engine.ensure(); const i = +m.dataset.i; if (i === cur) togglePlay(); else go(i, true); renderQueue(); }
});
function removeTrack(id){
  const t = byId(id); if (!t) return;
  const idx = order.indexOf(id), wasCur = id === currentId, wasPlaying = isPlayingUI();
  library = library.filter(x => x.id !== id);
  order = order.filter(x => x !== id);
  if (t.coverUrl) URL.revokeObjectURL(t.coverUrl);
  if (!t.demo) DB.del(id);
  rot.delete(id);
  if (wasCur){
    abortScrub(); audio.pause(); currentId = null;
    cur = order.length ? Math.min(idx, order.length - 1) : -1;
    loadCurrent(wasPlaying && order.length > 0);
  } else cur = order.indexOf(currentId);
  viewPos = Math.max(0, cur);
  resetRecords(); renderQueue(); updateMeta();
}

/* ---------- import ---------- */
function strip(t){ return { id: t.id, title: t.title, artist: t.artist, blob: t.blob, cover: t.cover, color: t.color || null, duration: t.duration, hue: t.hue, added: t.added }; }
function hydrate(t){ return Object.assign({}, t, { coverUrl: t.cover ? URL.createObjectURL(t.cover) : null, demo: false }); }
function fromName(name, tags){
  const base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  let artist = null, title = base;
  const m = base.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if (m){ artist = m[1].trim(); title = m[2].trim(); }
  return { title: tags.title || title, artist: tags.artist || artist || '' };
}
$('file').addEventListener('change', async () => {
  const files = [...$('file').files]; $('file').value = '';
  if (!files.length) return;
  toast('Загружаю ' + files.length + ' ' + plural(files.length, ['файл','файла','файлов']) + '…');
  const added = []; let skipped = 0, unsaved = 0;
  for (const f of files){
    if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|aac|wav|ogg)$/i.test(f.name)){ skipped++; continue; }
    const tags = await readTags(f);
    const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'audio/mpeg' });
    const nm = fromName(f.name, tags);
    const duration = await probeDuration(blob);
    let color = null;
    if (tags.cover){ try{ color = await colorOfBlob(tags.cover); }catch(e){ tags.cover = null; } }
    const t = { id: uid(), title: nm.title, artist: nm.artist, blob, cover: tags.cover, color, duration, hue: hueOf(nm.title + nm.artist), added: Date.now() + added.length };
    if (!(await DB.put(t))) unsaved++;
    added.push(hydrate(t));
  }
  if (!added.length){ toast('Не нашёл аудиофайлов — выбери mp3'); return; }
  const wasPlaying = isPlayingUI();
  const demoPlaying = !!track()?.demo;
  if (demoPlaying){ abortScrub(); audio.pause(); currentId = null; }
  library = library.filter(t => !t.demo).concat(added);
  const keep = (currentId && byId(currentId)) ? currentId : added[0].id;
  rebuildOrder(keep);
  resetRecords(); loadCurrent(false); renderQueue();
  if (wasPlaying && !demoPlaying) play();
  let msg = 'Добавлено: ' + added.length;
  if (skipped) msg += ', пропущено: ' + skipped;
  if (unsaved) msg += '. Браузер не дал сохранить — после перезагрузки их не будет';
  toast(msg);
});

/* ---------- media session ---------- */
if ('mediaSession' in navigator){
  const set = (a, fn) => { try{ navigator.mediaSession.setActionHandler(a, fn); }catch(e){} };
  set('play', () => play());
  set('pause', () => audio.pause());
  set('nexttrack', () => next(false));
  set('previoustrack', () => prev());
  set('seekto', d => { audio.currentTime = d.seekTime; updateMediaPos(); });
  set('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); updateMediaPos(); });
  set('seekforward', d => { audio.currentTime = Math.min(dur(), audio.currentTime + (d.seekOffset || 10)); updateMediaPos(); });
}
setInterval(() => { const t = track(); if (t && !t.demo && !holding) store.set('pos', { id: t.id, t: audio.currentTime || 0 }); }, 3000);

/* ---------- boot ---------- */
(async () => {
  measure();
  shuffle = store.get('shuffle', false); repeat = store.get('repeat', false);
  $('shuffleBtn').setAttribute('aria-pressed', shuffle); $('repeatBtn').setAttribute('aria-pressed', repeat);
  if (store.get('hintSeen', false)) $('hint').style.opacity = '0';
  updatePlayBtn();
  await DB.open();
  const rows = await DB.all();
  rows.sort((a, b) => a.added - b.added);
  library = rows.map(hydrate);
  let keep = null;
  if (!library.length){ library = makeDemos(); keep = 'demo1'; }
  else {
    const pos = store.get('pos', null);
    if (pos && library.some(t => t.id === pos.id)){ keep = pos.id; pendingSeek = pos; }
    else keep = library[0].id;
  }
  rebuildOrder(keep);
  loadCurrent(false);
  renderQueue();
  measure();
  requestAnimationFrame(t => { last = t; frame(t); });
  // older saved tracks: work out a background colour from their cover
  for (const t of library){
    if (t.cover && !t.color && !t.demo){
      try{ t.color = await colorOfBlob(t.cover); DB.put(strip(t)); if (t.id === currentId) applyTheme(t); }catch(e){}
    }
  }
})();
})();
</script>
