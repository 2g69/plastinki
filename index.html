<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пластинки</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Пластинки">
<meta name="theme-color" content="#E9E9E6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen player under frosted glass — queue tab, title, whirlpool stage (bleeds to the edges),
   scrub rail, transport. One deliberate light look: matte glass, black ink, Times. */
:root{
  --glass:#E9E9E6;
  --ink:#141414;
  --text:#111111;
  --muted:#3A3A38;
  --paper:#F4F4F1;
  --serif:'Times New Roman', Tinos, Times, serif;
  --halo:0 0 3px rgba(17,17,17,.35), 0 0 9px rgba(17,17,17,.18);
  --D:360px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--glass);color:var(--text);font-family:var(--serif);
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--text);outline-offset:4px;border-radius:12px}

/* the pane itself: grain + a soft light, under everything */
.frost{position:fixed;inset:0;pointer-events:none;z-index:0}
.frost svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.09}
.frost i{position:absolute;inset:0;background:radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%)}

.app{
  position:relative;z-index:1;
  height:100%;max-width:460px;margin:0 auto;
  display:flex;flex-direction:column;align-items:stretch;
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-block:12px 18px;
}
.top{display:flex;justify-content:center}
.queue-btn{width:56px;height:44px;display:grid;place-items:center;filter:drop-shadow(0 0 3px rgba(17,17,17,.35)) drop-shadow(0 0 9px rgba(17,17,17,.18))}
.queue-btn svg{width:34px;height:24px}
.queue-btn:active{transform:scale(.94)}
.meta{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px;min-width:0;text-shadow:0 0 8px rgba(17,17,17,.22)}
.title{margin:0;font-size:clamp(19px,6vw,24px);font-weight:400;letter-spacing:.14em;text-transform:uppercase;line-height:1.15;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.artist{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:9.5px;letter-spacing:.18em;border:1px solid var(--muted);border-radius:99px;padding:1px 7px 0;margin-left:8px;vertical-align:1px}

/* the water */
.stage{
  position:relative;flex:1 1 auto;min-height:220px;
  margin-left:calc(-1 * max(24px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(24px,env(safe-area-inset-right,0px)));
  overflow:hidden;touch-action:none;-webkit-touch-callout:none;
}
#liquid,#liquidFallback{position:absolute;left:50%;top:50%;translate:-50% -50%;transition:scale .2s ease}
#liquid{width:var(--D);height:var(--D);display:block}
#liquidFallback{border-radius:50%;background:conic-gradient(var(--ink),transparent 30%,var(--ink) 55%,transparent 80%,var(--ink));filter:blur(22px);opacity:.6;animation:spin 6s linear infinite}
@keyframes spin{to{rotate:360deg}}
.lp #liquid,.lp #liquidFallback{scale:.96}
.nb{position:absolute;top:50%;width:44%;aspect-ratio:1;border-radius:50%;background:var(--ink);opacity:.24;filter:blur(34px);
  translate:0 -50%;transition:opacity .6s ease;pointer-events:none}
.nb.prev{left:-31%}
.nb.next{right:-31%}
.nb.off{opacity:0}
.stage-grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;opacity:.09;pointer-events:none}
.pill{
  position:absolute;left:50%;top:6px;translate:-50% 0;z-index:3;
  background:var(--text);color:var(--paper);font-size:15px;padding:7px 16px;border-radius:99px;
  box-shadow:0 0 4px rgba(17,17,17,.45),0 0 14px rgba(17,17,17,.2);
  opacity:0;transition:opacity .15s;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none;
}
.held .pill{opacity:1}
.pill b{font-weight:400;font-size:12px;color:#A9A9A4;margin-left:10px}
.empty{
  position:absolute;left:50%;top:50%;translate:-50% -50%;width:calc(var(--D) * .7);height:calc(var(--D) * .7);z-index:2;
  border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;text-align:center;
  font-size:15px;letter-spacing:.16em;text-transform:uppercase;line-height:1.5;
}

/* time + rail */
.scrubrow{display:flex;align-items:center;gap:12px;padding-top:26px}
.t{flex:none;min-width:2.8em;font-size:14px;font-variant-numeric:tabular-nums}
.t.r{text-align:right}
.scrub{position:relative;flex:1 1 auto;height:40px;touch-action:none;cursor:pointer;border-radius:8px}
.rail,.fill{position:absolute;left:0;top:17px;height:6px;border-radius:99px;background:var(--ink)}
.rail{right:0;opacity:.22;filter:blur(2px)}
.fill{width:0;opacity:.75;filter:blur(1.2px)}
.thumb{position:absolute;left:0;top:6px;width:3px;height:28px;margin-left:-1.5px;border-radius:2px;background:var(--text);
  box-shadow:0 0 3px rgba(17,17,17,.5),0 0 10px rgba(17,17,17,.25)}

/* transport */
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;justify-items:center;margin-top:24px}
.ctl{width:56px;height:56px;display:grid;place-items:center;transition:opacity .25s,filter .25s}
.ctl svg{width:32px;height:32px}
.ctl[aria-pressed="false"]{opacity:.45;filter:blur(1.6px)}
.ctl[aria-pressed="true"]{filter:drop-shadow(0 0 3px rgba(17,17,17,.35)) drop-shadow(0 0 9px rgba(17,17,17,.18))}
.play{width:84px;height:84px;border-radius:50%;background:var(--text);color:var(--paper);display:grid;place-items:center;
  box-shadow:0 0 4px 1px rgba(17,17,17,.6),0 0 14px 3px rgba(17,17,17,.42),0 0 30px 6px rgba(17,17,17,.24),0 0 54px 10px rgba(17,17,17,.1);
  transition:transform .1s}
.play svg{width:30px;height:30px}
.play:active,.ctl:active{transform:scale(.93)}
.hint{text-align:center;font-size:12.5px;line-height:1.5;color:var(--muted);padding:16px 8px 0;min-height:36px;text-wrap:balance;transition:opacity .5s}

/* queue: a second pane of glass over the player */
.queue{
  position:fixed;inset:0;z-index:50;
  background:rgba(233,233,230,.8);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s;
}
.queue.open{opacity:1;visibility:visible;transition:opacity .3s ease}
.q-inner{
  position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 22px);
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
}
.q-head{display:flex;align-items:center;gap:10px}
.q-head h2{margin:0;font-size:22px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 8px rgba(17,17,17,.22)}
.count{flex:1 1 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{background:var(--text);color:var(--paper);font-size:14px;letter-spacing:.06em;padding:9px 15px;border-radius:99px;
  box-shadow:0 0 4px rgba(17,17,17,.45),0 0 14px rgba(17,17,17,.2);white-space:nowrap}
.btn.ghost{background:none;color:var(--text);box-shadow:none;padding:9px 4px 9px 8px}
.q-tip{margin:8px 0 14px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.q-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sc-panel{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sc-field{display:flex;align-items:center;gap:10px}
.sc-field input{flex:1 1 auto;min-width:0;font:inherit;font-size:16px;color:var(--text);background:transparent;border:0;border-bottom:1.5px solid var(--text);
  border-radius:0;padding:8px 2px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;outline:none;
  box-shadow:0 6px 8px -8px rgba(17,17,17,.5)}
.sc-field input::placeholder{color:var(--muted);opacity:.8}
.sc-field input:focus-visible{border-bottom-width:2px}
.sc-status{margin:0;min-height:1.2em;font-size:12.5px;color:var(--muted)}
.sc-status:empty{display:none}
.sc-results{list-style:none;margin:0;padding:0;max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column}
.sc-results:empty{display:none}
.sc-add{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 2px;min-height:56px}
.sc-art{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink) center/cover no-repeat;box-shadow:0 0 4px rgba(17,17,17,.35)}
.sc-plus{flex:none;width:32px;text-align:center;font-size:20px;line-height:1}
.sc-link{margin-top:2px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text);text-decoration:none;
  border-bottom:1px solid rgba(17,17,17,.4);padding:4px 0 1px;text-shadow:none}
.artist[data-loading]::after{content:" · загрузка";letter-spacing:.2em;opacity:.7}
.q-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 200px)}
.q-list{position:relative;list-style:none;margin:0;padding:2px 0 0 46px;display:flex;flex-direction:column;gap:4px}
.q-list::before{content:"";position:absolute;left:22px;top:20px;bottom:0;width:2px;background:var(--text);opacity:.55;filter:blur(.6px)}
.row{position:relative;display:flex;align-items:center;gap:2px;min-height:58px}
.q-drop{position:absolute;left:-46px;top:50%;translate:0 -50%;width:46px;height:46px;display:grid;place-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ink);background-size:cover;background-position:center;box-shadow:0 0 3px rgba(17,17,17,.35)}
.dot.has-cover{width:18px;height:18px}
.li-cur .dot{width:24px;height:24px;box-shadow:0 0 6px rgba(17,17,17,.5),0 0 16px rgba(17,17,17,.3)}
.li-cur.playing .dot:not(.has-cover){animation:morph 4s ease-in-out infinite}
.li-cur.playing .dot.has-cover{animation:spin 6s linear infinite}
@keyframes morph{0%,100%{border-radius:46% 54% 42% 58%/55% 45% 55% 45%}33%{border-radius:58% 42% 55% 45%/42% 58% 44% 56%}66%{border-radius:40% 60% 48% 52%/60% 40% 58% 42%}}
.li-cur{text-shadow:0 0 8px rgba(17,17,17,.22)}
.q-main{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 2px}
.q-text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.q-title{font-size:15px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-artist{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-dur{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-del{flex:none;min-width:40px;height:40px;display:grid;place-items:center;color:var(--muted);opacity:.6;border-radius:12px}
.q-del svg{width:16px;height:16px}
.q-del.confirm{opacity:1;color:#7A1C28;font-size:13px;padding:0 6px}
.q-empty{padding:28px 0;color:var(--muted);font-size:14px;list-style:none}
.q-fade{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.q-fade.a{height:250px;-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%);mask-image:linear-gradient(to bottom,transparent,#000 40%)}
.q-fade.b{height:180px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 45%);mask-image:linear-gradient(to bottom,transparent,#000 45%)}
.q-fade.c{height:120px;background:rgba(233,233,230,.3);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 55%);mask-image:linear-gradient(to bottom,transparent,#000 55%)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);translate:-50% -16px;z-index:200;
  background:var(--text);color:var(--paper);font-size:14px;letter-spacing:.04em;padding:9px 18px;border-radius:99px;
  box-shadow:0 0 4px rgba(17,17,17,.45),0 0 14px rgba(17,17,17,.2);
  opacity:0;transition:opacity .2s,translate .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;translate:-50% 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hapt{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

@media (prefers-reduced-motion: reduce){
  .queue,.toast,.hint{transition:none}
  #liquidFallback,.li-cur.playing .dot{animation:none !important}
}
</style>
</head>
<body>


<div class="frost" aria-hidden="true">
  <svg><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>
  <i></i>
</div>

<div class="app">
  <div class="top">
    <button class="queue-btn" id="queueBtn" aria-label="Открыть очередь">
      <svg viewBox="0 0 34 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="2" width="28" height="6" rx="3"/><path d="M3 15h28M3 21h28"/></svg>
    </button>
  </div>

  <div class="meta">
    <h1 class="title" id="title">Пластинки</h1>
    <div class="artist" id="artist">&nbsp;</div>
    <a class="sc-link" id="scLink" href="https://soundcloud.com" target="_blank" rel="noopener" hidden>Открыть на SoundCloud ↗</a>
  </div>

  <div class="stage" id="stage" tabindex="0" aria-label="Вода под стеклом. Крути пальцем — перемотка, тап — пауза, удержание — обложка, тап сбоку — соседний трек. Стрелки влево и вправо меняют трек.">
    <div class="nb prev off" id="nbPrev"></div>
    <div class="nb next off" id="nbNext"></div>
    <div id="liquidFallback" hidden></div>
    <canvas id="liquid"></canvas>
    <svg class="stage-grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
    <div class="pill" id="pill">0:00<b>+0:00</b></div>
    <button class="empty" id="emptyBtn" hidden>Загрузить<br>mp3</button>
  </div>

  <div class="scrubrow">
    <span class="t" id="tCur">0:00</span>
    <div class="scrub" id="bar" role="slider" tabindex="0" aria-label="Позиция в треке" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="rail"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div>
    </div>
    <span class="t r" id="tLeft">−0:00</span>
  </div>

  <div class="controls">
    <button class="ctl" id="shuffleBtn" aria-label="Перемешать очередь" aria-pressed="false">
      <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h5c6 0 8 16 14 16h7M3 25h5c2.6 0 4.3-3 5.8-6.5M19.5 13.5C21 11 22.5 9 25 9h4"/><path d="M25 5l4 4-4 4M25 21l4 4-4 4"/></svg>
    </button>
    <button class="play" id="playBtn" aria-label="Играть">
      <svg viewBox="0 0 34 34" id="playIcon" fill="currentColor" aria-hidden="true"></svg>
    </button>
    <button class="ctl" id="repeatBtn" aria-label="Повторять текущий трек" aria-pressed="false">
      <svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 26H9a5 5 0 0 1-5-5v-8a5 5 0 0 1 5-5h16a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-1"/><path d="M21 22l-4 4 4 4"/><path d="M15.5 13.5l2-1.5v8" stroke-width="2.2"/></svg>
    </button>
  </div>
  <div class="hint" id="hint">Крути воду пальцем — перемотка. Удерживай — обложка. Тап сбоку — соседний трек.</div>
</div>

<div class="queue" id="sheet" aria-hidden="true" role="dialog" aria-label="Очередь">
  <div class="q-inner">
    <div class="q-head">
      <h2>Очередь</h2>
      <span class="count" id="qCount"></span>
      <button class="btn ghost" id="closeBtn">Готово</button>
    </div>
    <div class="q-actions">
      <button class="btn" id="addBtn">+ mp3</button>
      <button class="btn" id="scBtn" aria-expanded="false" aria-controls="scPanel">+ SoundCloud</button>
    </div>
    <form class="sc-panel" id="scPanel" hidden>
      <label class="sr" for="scInput">Ссылка SoundCloud или поиск</label>
      <div class="sc-field">
        <input id="scInput" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ссылка или название">
        <button class="btn" id="scGo" type="submit">Найти</button>
      </div>
      <p class="sc-status" id="scStatus" role="status"></p>
      <ol class="sc-results" id="scResults"></ol>
    </form>
    <p class="q-tip">Нажми на каплю слева, чтобы поставить свою обложку.</p>
    <div class="q-scroll"><ol class="q-list" id="qList"></ol></div>
  </div>
  <div class="q-fade a" aria-hidden="true"></div>
  <div class="q-fade b" aria-hidden="true"></div>
  <div class="q-fade c" aria-hidden="true"></div>
</div>

<input type="file" id="file" accept="audio/mpeg,audio/mp3,.mp3,audio/*" multiple class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="coverFile" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status"></div>
<label class="hapt" id="haptLabel" for="hapt" aria-hidden="true"><input type="checkbox" id="hapt" switch tabindex="-1"></label>

<script>
(() => {
'use strict';
const SEC_PER_TURN = 15;          // один оборот пальцем = 15 секунд трека
const RPM_DEG = 200;              // 33⅓ об/мин = 200°/с
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const stage = $('stage'), bar = $('bar');
const audio = new Audio();
audio.preload = 'auto';

let library = [];   // {id,title,artist,blob,cover,coverUrl,color,duration,hue,demo,added}
let order = [];
let cur = -1;
let currentId = null, currentUrl = null;
let shuffle = false, repeat = false;
let viewPos = 0;
let holding = false, resumeAfter = false, coast = null, motorOn = false, handoff = null;
let scrubT = 0, scrubStart = 0;
let D = 330;

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('plastinki:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('plastinki:'+k, JSON.stringify(v)); }catch(e){} }
};
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const DB = {
  db: null,
  async open(){
    try{
      const r = indexedDB.open('plastinki', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath: 'id' });
      this.db = await reqP(r);
    }catch(e){ this.db = null; }
  },
  os(mode){ return this.db.transaction('tracks', mode).objectStore('tracks'); },
  async all(){ if(!this.db) return []; try{ return await reqP(this.os('readonly').getAll()); }catch(e){ return []; } },
  async put(t){ if(!this.db) return false; try{ await reqP(this.os('readwrite').put(t)); return true; }catch(e){ return false; } },
  async del(id){ if(!this.db) return; try{ await reqP(this.os('readwrite').delete(id)); }catch(e){} }
};

/* ---------- helpers ---------- */
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

/* ---------- variable-speed playback ----------
   While a finger turns the water, the decoded track plays from a buffer at a variable
   (also negative) speed that follows the water: turn forwards and the music speeds up. */
const engine = {
  ctx: null, node: null, buf: null, bufSR: 22050, bufId: null,
  pos: 0, rate: 0, target: 0, mode: 'off', gain: 0, gainTarget: 0,
  lp: 0, hx: 0, hy: 0,
  ensure(){
    try{
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try{ if (navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
        this.ctx = new AC();
        this.node = this.ctx.createScriptProcessor(1024, 1, 1);
        this.node.onaudioprocess = e => this.process(e.outputBuffer.getChannelData(0));
        this.node.connect(this.ctx.destination);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
      return true;
    }catch(e){ return false; }
  },
  ready(){ return !!(this.ctx && this.buf && this.bufId === currentId); },
  process(out){
    const n = out.length;
    if (this.gainTarget === 0 && this.gain < 1e-4){ out.fill(0); this.gain = 0; this.lp = 0; this.hx = 0; this.hy = 0; return; }
    const sr = this.ctx.sampleRate, dt = 1 / sr;
    const rs = 1 - Math.exp(-dt / 0.04), ms = 1 - Math.exp(-dt / 0.07), gs = 1 - Math.exp(-dt / 0.025);
    const data = this.ready() ? this.buf : null, bsr = this.bufSR, len = data ? data.length : 0, maxT = dur();
    for (let i = 0; i < n; i++){
      let want = 0, k = rs;
      if (this.mode === 'follow') want = clamp((this.target - this.pos) * 14, -24, 24);
      else if (this.mode === 'motor'){ want = 1; k = ms; }
      this.rate += (want - this.rate) * k;
      this.pos += this.rate * dt;
      if (this.pos < 0){ this.pos = 0; if (this.rate < 0) this.rate = 0; }
      else if (maxT && this.pos > maxT){ this.pos = maxT; if (this.rate > 0) this.rate = 0; }
      const ar = Math.abs(this.rate);
      let s = 0;
      if (data){
        const xp = this.pos * bsr, i0 = xp | 0;
        if (i0 >= 0 && i0 < len - 1){ const f = xp - i0; s = data[i0] + (data[i0 + 1] - data[i0]) * f; }
      }
      const a = ar > 3 ? Math.min(1, 3.5 / Math.sqrt(ar)) : 1;   // only tames aliasing at high speed
      this.lp += a * (s - this.lp);
      const y = this.lp;
      this.hy = y - this.hx + 0.996 * this.hy; this.hx = y;
      this.gain += (this.gainTarget - this.gain) * gs;
      out[i] = this.hy * this.gain;

};
let decodeTimer = null, decodeToken = 0;
function scheduleDecode(t){
  engine.buf = null; engine.bufId = null;
  clearTimeout(decodeTimer);
  const tok = ++decodeToken;
  decodeTimer = setTimeout(async () => {
    try{
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!OAC) return;
      let oc; try{ oc = new OAC(1, 1, 22050); }catch(e){ oc = new OAC(1, 1, 44100); }
      const ab = await t.blob.arrayBuffer();
      const b = await new Promise((res, rej) => { const p = oc.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
      if (tok !== decodeToken) return;
      const n = b.length, ch = b.numberOfChannels, d = new Float32Array(n);
      for (let c = 0; c < ch; c++){ const x = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] += x[i] / ch; }
      engine.buf = d; engine.bufSR = b.sampleRate; engine.bufId = t.id;
    }catch(e){ /* scratch falls back to synthetic noise */ }
  }, 350);
}

/* ---------- colour from cover ---------- */
function loadImage(src){
  return new Promise((res, rej) => {
    const u = src instanceof Blob ? URL.createObjectURL(src) : null;
    const im = new Image();
    im.onload = () => res({ im, done: () => u && URL.revokeObjectURL(u) });
    im.onerror = () => { if (u) URL.revokeObjectURL(u); rej(new Error('img')); };
    im.src = u || src;

}
function dominantColor(img){
  const S = 32, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data;
  const bins = Array.from({ length: 24 }, () => ({ w: 0, vx: 0, vy: 0, s: 0 }));
  let total = 0;
  for (let i = 0; i < d.length; i += 4){
    const r = d[i] / 255, g = d[i+1] / 255, b = d[i+2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, ch = mx - mn;
    if (ch < 0.02) continue;
    const s = ch / (1 - Math.abs(2 * l - 1) || 1);
    let h = mx === r ? ((g - b) / ch) % 6 : mx === g ? (b - r) / ch + 2 : (r - g) / ch + 4;
    h = (h * 60 + 360) % 360;
    const w = ch * (1 - Math.abs(l - 0.5) * 1.4);
    if (w <= 0) continue;
    const bi = Math.floor(h / 15) % 24, rad = h * Math.PI / 180;
    bins[bi].w += w; bins[bi].vx += Math.cos(rad) * w; bins[bi].vy += Math.sin(rad) * w; bins[bi].s += Math.min(1, s) * w;
    total += w;
  }
  let best = -1, bw = 0;
  for (let i = 0; i < 24; i++){ const w = bins[i].w + 0.5 * (bins[(i + 23) % 24].w + bins[(i + 1) % 24].w); if (w > bw){ bw = w; best = i; } }
  if (best < 0) return { h: 250, s: 0.06 };
  const B = [bins[(best + 23) % 24], bins[best], bins[(best + 1) % 24]];
  const vx = B.reduce((a, q) => a + q.vx, 0), vy = B.reduce((a, q) => a + q.vy, 0);
  const w = B.reduce((a, q) => a + q.w, 0), s = B.reduce((a, q) => a + q.s, 0) / (w || 1);
  const h = (Math.atan2(vy, vx) * 180 / Math.PI + 360) % 360;

}
async function colorOfBlob(blob){
  const { im, done } = await loadImage(blob);
  try{ return dominantColor(im); } finally { done(); }
}
async function processCover(file){
  const { im, done } = await loadImage(file);
  try{
    const S = 640, c = document.createElement('canvas'); c.width = c.height = S;
    const m = Math.min(im.naturalWidth, im.naturalHeight);
    c.getContext('2d').drawImage(im, (im.naturalWidth - m) / 2, (im.naturalHeight - m) / 2, m, m, 0, 0, S, S);
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.86));
    return { blob, color: dominantColor(c) };
  } finally { done(); }
}
/* ---------- ID3 tags ---------- */
function decodeText(enc, b){
  try{
    let s;
    if (enc === 0) s = new TextDecoder(b.some(x => x > 0x7f) ? 'windows-1251' : 'utf-8').decode(b);
    else if (enc === 1) s = new TextDecoder(b[0] === 0xFE && b[1] === 0xFF ? 'utf-16be' : 'utf-16le').decode(b);
    else if (enc === 2) s = new TextDecoder('utf-16be').decode(b);
    else s = new TextDecoder('utf-8').decode(b);
    return s.replace(/^﻿/, '').split('\0').filter(Boolean)[0]?.trim() || null;
  }catch(e){ return null; }
}
function readPic(d, v22){
  const enc = d[0]; let i = 1, mime;
  if (v22){ mime = 'image/' + String.fromCharCode(d[1], d[2], d[3]).toLowerCase().replace('jpg','jpeg'); i = 4; }
  else { let j = i; while (j < d.length && d[j] !== 0) j++; mime = String.fromCharCode(...d.subarray(i, j)).toLowerCase(); i = j + 1; if (!mime.includes('/')) mime = 'image/' + (mime.replace('jpg','jpeg') || 'jpeg'); }

  else { while (i < d.length && d[i] !== 0) i++; i++; }
  if (i >= d.length) return null;
  return new Blob([d.slice(i)], { type: mime });
}
async function readTags(file){
  const out = { title: null, artist: null, cover: null };
  try{
    const h = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (h[0] !== 0x49 || h[1] !== 0x44 || h[2] !== 0x33) return out;
    const ver = h[3], flags = h[5];
    const size = (h[6]&0x7f)<<21 | (h[7]&0x7f)<<14 | (h[8]&0x7f)<<7 | (h[9]&0x7f);
    let buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
    if ((flags & 0x80) && ver < 4){ const o = []; for (let i = 0; i < buf.length; i++){ o.push(buf[i]); if (buf[i] === 0xFF && buf[i+1] === 0) i++; } buf = Uint8Array.from(o); }
    const be32 = p => (buf[p]<<24 | buf[p+1]<<16 | buf[p+2]<<8 | buf[p+3]) >>> 0;
    const ss = p => (buf[p]&0x7f)<<21 | (buf[p+1]&0x7f)<<14 | (buf[p+2]&0x7f)<<7 | (buf[p+3]&0x7f);
    let p = 0;
    if (flags & 0x40) p = ver === 4 ? ss(0) : be32(0) + 4;
    if (ver === 2){
      while (p + 6 <= buf.length){
        const id = String.fromCharCode(buf[p], buf[p+1], buf[p+2]);
        const sz = buf[p+3]<<16 | buf[p+4]<<8 | buf[p+5];
        if (!/^[A-Z0-9]{3}$/.test(id) || sz <= 0) break;
        const d = buf.subarray(p + 6, p + 6 + sz);
        if (id === 'TT2') out.title = decodeText(d[0], d.subarray(1));
        else if (id === 'TP1') out.artist = decodeText(d[0], d.subarray(1));
        else if (id === 'PIC' && !out.cover) out.cover = readPic(d, true);
        p += 6 + sz;
      }
    } else {
      while (p + 10 <= buf.length){
        const id = String.fromCharCode(buf[p], buf[p+1], buf[p+2], buf[p+3]);
        const sz = ver === 4 ? ss(p + 4) : be32(p + 4);
        if (!/^[A-Z0-9]{4}$/.test(id) || sz <= 0) break;
        const d = buf.subarray(p + 10, p + 10 + sz);
        if (id === 'TIT2') out.title = decodeText(d[0], d.subarray(1));
        else if (id === 'TPE1') out.artist = decodeText(d[0], d.subarray(1));
        else if (id === 'APIC' && !out.cover) out.cover = readPic(d, false);
        p += 10 + sz;
      }
    }
  }catch(e){}

}
function probeDuration(blob){
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(blob); let done = false;
    const fin = v => { if (done) return; done = true; URL.revokeObjectURL(u); a.removeAttribute('src'); res(v); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => fin(isFinite(a.duration) ? a.duration : 0);
    a.onerror = () => fin(0);
    setTimeout(() => fin(0), 6000);
    a.src = u;
  });

/* ---------- demo tracks ---------- */
function wav(f, sr){
  const n = f.length, b = new ArrayBuffer(44 + n*2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i*2, clamp(f[i], -1, 1) * 32767, true);
  return new Blob([b], { type: 'audio/wav' });
}
function synth(bpm, chords, bars, seed){
  const sr = 22050, beat = 60 / bpm, barLen = beat * 4, secs = barLen * bars;
  const n = Math.floor(sr * secs), out = new Float32Array(n);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let r = seed; const rand = () => ((r = (r * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff) * 2 - 1;
  let lp = 0, peak = 0;
  for (let i = 0; i < n; i++){
    const t = i / sr;
    const ch = chords[Math.floor(t / barLen) % chords.length];
    const tb = t % beat, t8 = t % (beat / 2), step = Math.floor(t / (beat / 2));
    const kick = Math.sin(TAU*(45*tb + 80*(1 - Math.exp(-28*tb))/28)) * Math.exp(-tb*7) * 0.9;
    const off = tb - beat / 2;
    const hat = off >= 0 ? rand() * Math.exp(-off*55) * 0.16 : 0;
    const bf = mtof(ch[0] - 12), ph = (bf*t) % 1;
    const bass = (2*Math.abs(2*ph - 1) - 1) * 0.34 * Math.exp(-t8*4);
    let pad = 0; for (const m of ch){ const f = mtof(m); pad += ((f*t) % 1)*2 - 1 + ((f*1.004*t) % 1)*2 - 1; }
    lp += (pad * 0.06 - lp) * 0.07;
    const duck = 0.45 + 0.55 * Math.min(1, tb / (beat * 0.6));
    const arp = Math.sin(TAU*mtof(ch[step % ch.length] + 12)*t) * Math.exp(-t8*8) * 0.2;
    const s = kick + hat + bass + lp*duck + arp;
    out[i] = s; peak = Math.max(peak, Math.abs(s));
  }
  const g = 0.85 / (peak || 1), fo = sr * 1.5;
  for (let i = 0; i < n; i++){ let k = g; if (i < 800) k *= i / 800; if (i > n - fo) k *= (n - i) / fo; out[i] *= k; }
  return { blob: wav(out, sr), duration: secs };
}

/* ---------- order / playback ---------- */
function rebuildOrder(keepId){
  const ids = library.map(t => t.id);
  if (shuffle){
    const rest = ids.filter(i => i !== keepId);
    for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
    order = keepId && ids.includes(keepId) ? [keepId, ...rest] : rest;
  } else order = ids;
  cur = order.length ? Math.max(0, order.indexOf(keepId)) : -1;
  viewPos = Math.max(0, cur);
}
function cancelHandoff(){ clearTimeout(handoff); handoff = null; motorOn = false; }
function abortScrub(){
  holding = false; coast = null; resumeAfter = false; cancelHandoff();
  stage.classList.remove('held');
  engine.gainTarget = 0;
}
function loadCurrent(autoplay){
  const t = track();
  if (!t){
    abortScrub(); dropHls(); scLoadToken++; audio.pause(); audio.removeAttribute('src'); audio.load();
    if (currentUrl) URL.revokeObjectURL(currentUrl); currentUrl = null; currentId = null;
    applyTheme(null); updateMeta(); return;
  }
  if (currentId !== t.id){
    abortScrub(); dropHls(); scLoadToken++;
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = null; currentId = t.id; audio.loop = repeat;
    liquid.splash();
    if (t.sc){
      // SoundCloud: no local file, ask our server for the stream; never sped up or reversed
      audio.pause(); audio.removeAttribute('src'); audio.load();
      engine.buf = null; engine.bufId = null; scRetry = 0;
      applyTheme(t); updateMeta();
      loadSC(t, autoplay);
      return;
    }
    currentUrl = URL.createObjectURL(t.blob);
    audio.src = currentUrl;
    scheduleDecode(t);
  }
  applyTheme(t);
  updateMeta();
  if (autoplay) play();
}
function play(){
  if (!track()) return;
  const p = audio.play();
  if (p && p.catch) p.catch(() => { if (motorOn){ cancelHandoff(); engine.gainTarget = 0; updatePlayBtn(); } });
}
function go(i, autoplay){
  if (!order.length) return;
  i = clamp(i, 0, order.length - 1);
  if (i === cur && currentId === order[i]){ if (autoplay && audio.paused) play(); return; }
  cur = i; loadCurrent(autoplay); renderQueue();
}
function next(auto){
  if (cur < order.length - 1) go(cur + 1, auto ? true : isPlayingUI());
  else if (auto){ go(0, false); audio.currentTime = 0; }
  else go(0, isPlayingUI());
}
function prev(){
  if (audio.currentTime > 3 || cur === 0) audio.currentTime = 0;
  else go(cur - 1, isPlayingUI());
}
function togglePlay(){
  const t = track();
  if (!t) return;
  if (t.sc && !hls && !audio.currentSrc){ scPendingPlay = !scPendingPlay; if (scPendingPlay) toast('Секунду, загружаю трек…'); return; }
  if (motorOn){ cancelHandoff(); engine.gainTarget = 0; audio.pause(); updatePlayBtn(); return; }
  audio.paused ? play() : audio.pause();
}

audio.addEventListener('play', updatePlayBtn);
audio.addEventListener('pause', updatePlayBtn);
audio.addEventListener('playing', () => { if (motorOn){ motorOn = false; engine.gainTarget = 0; } updatePlayBtn(); });
audio.addEventListener('ended', () => { if (!repeat) next(true); });
let pendingSeek = null;
audio.addEventListener('loadedmetadata', () => {
  const t = track();
  if (t && isFinite(audio.duration) && Math.abs((t.duration || 0) - audio.duration) > 0.5){
    t.duration = audio.duration;

    renderQueue();
  }
  if (pendingSeek != null && t && t.id === pendingSeek.id){ audio.currentTime = Math.min(pendingSeek.t, audio.duration - 1); pendingSeek = null; }

}

/* ---------- colour of the water ---------- */
function hslToRgb(h, s, l){
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
function applyTheme(t){
  let ink = [0.078, 0.078, 0.078];
  if (t && t.color && t.color.s > 0.12) ink = hslToRgb(t.color.h, Math.min(0.5, t.color.s), 0.14);
  liquid.setInk(ink);
  document.documentElement.style.setProperty('--ink', 'rgb(' + ink.map(v => Math.round(v * 255)).join(',') + ')');
}

/* ---------- the whirlpool under the glass (WebGL2) ----------
   A free vortex: water turns faster near the centre and is drawn inwards; wide trailing arms
   (3–6 of them, the number drifts); the outer arms touch the glass here and there (sharp,
   glossy, a few soft drops). On pause it hits a barrier, sloshes, stops and sinks deeper. */
function liquidShaders(){
    // Whirlpool: wide trailing spiral arms (their number drifts between 3 and 6) feeding a deep, blurred core.
    // Only parts of the outer arms come up to the glass (sharp, glossy, a few soft drops).
    var COMMON = [
      'precision highp float;',
      'uniform vec2 uRes; uniform float uT; uniform float uTheta; uniform float uOmega; uniform float uImpact; uniform float uTau; uniform float uDir;',
      'float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }',
      'float noise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);',
      '  float a = hash(i), b = hash(i+vec2(1.0,0.0)), c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));',
      '  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y); }',
      'float fbm3(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ s += a*noise(p); p = p*2.03 + vec2(1.7,9.2); a *= 0.5; } return s/0.875; }',
      'float fbm5(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*noise(p); p = p*2.03 + vec2(1.7,9.2); a *= 0.5; } return s/0.96875; }',
      'vec2 rot(vec2 p, float a){ float c = cos(a), s = sin(a); return vec2(c*p.x - s*p.y, s*p.x + c*p.y); }',
      'float fbm4(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a*noise(p); p = p*2.03 + vec2(1.7,9.2); a *= 0.5; } return s/0.9375; }',
      '// free vortex: the closer to the centre, the faster the water turns and the more it is drawn in',
      'float body(vec2 p, bool hi, out float aq, out float rq, out float arm){',
      '  float r = length(p);',
      '  vec2 q = rot(p, -uTheta*0.3);',
      '  vec2 w = vec2(fbm3(q*2.0 + vec2(uT*0.3, 0.0)), fbm3(q*2.0 + vec2(5.2, -uT*0.25)));',
      '  q += (w - 0.5)*0.12;',
      '  rq = length(q); aq = atan(q.y, q.x);',
      '  float om = 0.38/(r + 0.08);',
      '  float T = 1.6;',
      '  float f0 = fract(uTau/T), f1 = fract(uTau/T + 0.5);',
      '  float w0 = 1.0 - abs(2.0*f0 - 1.0);',
      '  vec2 s0 = rot(p, -uDir*om*f0*T)*exp(0.22*f0*T);',
      '  vec2 s1 = rot(p, -uDir*om*f1*T)*exp(0.22*f1*T);',
      '  float n0 = hi ? fbm4(s0*5.5) : fbm3(s0*3.5);',
      '  float n1 = hi ? fbm4(s1*5.5 + 7.3) : fbm3(s1*3.5 + 7.3);',
      '  float n = mix(n1, n0, w0);',
      '  float lr = log(rq + 0.03);',
      '  float Nt = 4.5 + 1.7*sin(uT*0.25 + 0.7);',
      '  float N1 = floor(Nt);',
      '  float bl = smoothstep(0.2, 0.8, fract(Nt));',
      '  float base = lr*3.2*uDir + 2.4*(n - 0.5);',
      '  arm = mix(0.5 + 0.5*cos(aq*N1 + base), 0.5 + 0.5*cos(aq*(N1 + 1.0) + base), bl);',
      '  float armD = 0.6 + 0.4*arm;',
      '  float env = 1.0 - smoothstep(0.30, 0.48, rq);',
      '  float core = 1.0 - smoothstep(0.0, 0.16, r);',
      '  return max(core*0.95, armD*env*(0.5 + 0.75*n));',
      '}'
    ].join('\n');

    var VS = '#version 300 es\nlayout(location=0) in vec2 aP;\nvoid main(){ gl_Position = vec4(aP, 0.0, 1.0); }';

    var FS1 = '#version 300 es\n' + COMMON + '\n' + [
      'out vec4 o;',
      'void main(){',
      '  vec2 p = (gl_FragCoord.xy - 0.5*uRes)/min(uRes.x, uRes.y);',
      '  p.x = -p.x;',
      '  float aq, rq, arm;',
      '  float f = body(p, false, aq, rq, arm);',
      '  o = vec4(clamp(f*0.7, 0.0, 1.0), 0.0, 0.0, 1.0);',
      '}'
    ].join('\n');

    var FS2 = '#version 300 es\n' + COMMON + '\n' + [
      'uniform sampler2D uTex; uniform float uNear; uniform float uTouch; uniform float uTouchA; uniform vec3 uInk;',
      'out vec4 o;',
      'float blurF(vec2 uv, float r){ float s = texture(uTex, uv).r*0.2; for (int i = 0; i < 8; i++){ float a = float(i)*0.785398; s += texture(uTex, uv + vec2(cos(a), sin(a))*r).r*0.1; } return s/0.7; }',
      'void main(){',
      '  vec2 uv = gl_FragCoord.xy/uRes;',
      '  vec2 p = (gl_FragCoord.xy - 0.5*uRes)/min(uRes.x, uRes.y);',
      '  p.x = -p.x;',
      '  float fa = blurF(uv, mix(0.09, 0.035, uNear));',
      '  float farA = smoothstep(0.06, 0.85, fa)*mix(0.5, 0.86, uNear);',
      '  vec3 farCol = mix(uInk, vec3(0.913, 0.913, 0.902), mix(0.5, 0.16, uNear));',
      '  vec3 col = farCol*farA; float A = farA;',
      '  float z = 0.0, drop = 0.0, hl = 0.0;',
      '  float upper = uNear*0.8 + uImpact*1.1 + uTouch*1.2;',
      '  if (upper > 0.12 && fa > 0.015){',
      '    float aq, rq, arm;',
      '    float b = body(p, true, aq, rq, arm);',
      '    float win = smoothstep(0.15, 0.25, rq)*(1.0 - smoothstep(0.40, 0.47, rq));',
      '    float crestC = pow(0.5 + 0.5*cos(aq - 0.5), 3.0) + pow(0.5 + 0.5*cos(aq - 3.64), 3.0);',
      '    float spots = 0.0;',
      '    for (int k = 0; k < 4; k++){',
      '      float fk = float(k);',
      '      float ak = 0.5 + fk*1.62 + 0.35*sin(uT*0.23 + fk*1.7);',
      '      float pk = smoothstep(0.25, 0.95, 0.5 + 0.5*sin(uT*(0.55 + 0.13*fk) + fk*2.3));',
      '      spots += pow(0.5 + 0.5*cos(aq - ak), 10.0)*pk;',
      '    }',
      '    float a = atan(p.y, p.x);',
      '    float dA = abs(mod(a - uTouchA + 3.14159, 6.28318) - 3.14159);',
      '    float touch = uTouch*exp(-dA*dA/0.35)*smoothstep(0.12, 0.22, length(p));',
      '    float contact = (uNear*spots*0.8 + uImpact*crestC*1.0)*win + touch*1.2;',
      '    z = b*contact*smoothstep(0.35, 0.85, arm);',
      '    float armEdge = smoothstep(0.08, 0.25, arm)*(1.0 - smoothstep(0.3, 0.55, arm));',
      '    vec2 dq = vec2(aq/6.28318*30.0, rq*26.0);',
      '    vec2 id = floor(dq); vec2 f = fract(dq) - 0.5;',
      '    if (hash(id + 11.0) > 0.86){',
      '      vec2 c = (vec2(hash(id + 3.1), hash(id + 7.7)) - 0.5)*0.45;',
      '      float rad = 0.16 + 0.2*hash(id + 1.3);',
      '      float k = armEdge*smoothstep(0.25, 0.5, contact);',
      '      drop = (1.0 - smoothstep(rad*0.35, rad, length(f - c)))*k*0.85;',
      '      hl = (1.0 - smoothstep(0.0, rad*0.5, length(f - c - vec2(-0.25, 0.3)*rad)))*k*0.45;',
      '    }',
      '  }',
      '  vec2 g = vec2(dFdx(z), dFdy(z));',
      '  float edge = smoothstep(0.30, 0.335, z);',
      '  vec3 n = normalize(vec3(-g*60.0, 1.0));',
      '  vec3 L = normalize(vec3(-0.45, 0.65, 0.75));',
      '  float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 24.0);',
      '  float rim = edge*(1.0 - smoothstep(0.335, 0.42, z));',
      '  float halo = smoothstep(0.12, 0.30, z)*(1.0 - edge)*0.35;',
      '  col = col*(1.0 - halo) + uInk*0.3*halo; A = A*(1.0 - halo) + halo;',
      '  float na = max(edge, drop);',
      '  col = col*(1.0 - na) + uInk*0.22*na; A = A*(1.0 - na) + na;',
      '  col += vec3(1.0)*(spec*0.85*edge + rim*0.22 + hl*0.8);',
      '  col += (hash(gl_FragCoord.xy*0.73) - 0.5)*0.05*A;',
      '  A = clamp(A, 0.0, 1.0);',
      '  o = vec4(min(max(col, vec3(0.0)), vec3(A)), A);',
      '}'
    ].join('\n');
    return { VS: VS, FS1: FS1, FS2: FS2 };
}
const liquid = {
  ok: false, cv: null, gl: null, LO: 128, loc: {},
  ink: [0.078, 0.078, 0.078], inkT: [0.078, 0.078, 0.078],
  s: { theta: 0, extQ: 0, tau: 0, dir: 1, omega: 0, near: 0, impact: 0, t: 3, wasPlaying: false, stop: 0, brake: false, glide: false, hold: 1, touch: 0, touchA: 0.87 },
  setInk(rgb){ this.inkT = rgb.slice(); },
  splash(){ this.s.impact = Math.max(this.s.impact, 0.4); },
  init(cv){
    this.cv = cv;
    let gl = null;
    try{ gl = cv.getContext('webgl2', { premultipliedAlpha: true, antialias: false, alpha: true }); }catch(e){ gl = null; }
    if (!gl) return false;
    try{
      const SH = liquidShaders();
      const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      const prog = fs => { const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, SH.VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
      this.p1 = prog(SH.FS1); this.p2 = prog(SH.FS2);
    }catch(e){ return false; }
    this.gl = gl;
    gl.bindVertexArray(gl.createVertexArray());
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, this.LO, this.LO, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.ok = true;
    return true;
  },
  // o: { playing, rate, ext (radians turned by hand this frame, or null), touch 0|1, touchA }
  step(dt, o){
    const s = this.s;
    if (o.ext !== null){
      s.extQ += o.ext;                                   // the water follows the finger with a little lag
      const take = s.extQ * (1 - Math.exp(-dt * 7));
      s.extQ -= take; s.theta += take;
      s.omega += (take / Math.max(dt, 1e-3) - s.omega) * (1 - Math.exp(-dt * 4));
      s.near += (1 - s.near) * (1 - Math.exp(-dt * 1.8));
      s.brake = false; s.glide = true; s.hold = 0; s.wasPlaying = o.playing;
    } else {
      if (o.playing){
        s.brake = false; s.glide = false;
        s.omega += (0.75 * o.rate - s.omega) * (1 - Math.exp(-dt * 0.8));
        s.near += (1 - s.near) * (1 - Math.exp(-dt * 1.0));
      } else {
        if (s.wasPlaying && !s.glide){ s.brake = true; s.stop = s.theta + s.omega * 0.55; s.impact = Math.max(s.impact, 0.55); s.hold = 0; }
        if (s.glide) s.omega *= Math.exp(-dt * 1.2);
        else if (s.brake) s.omega += (-10 * (s.theta - s.stop) - 3 * s.omega) * dt;
        s.hold += dt;
        if (s.hold > 0.4) s.near += (0 - s.near) * (1 - Math.exp(-dt * 0.7));
      }
      s.wasPlaying = o.playing;
      const rest = s.extQ * (1 - Math.exp(-dt * 7));
      s.extQ -= rest;
      s.theta += s.omega * dt + rest;
    }
    s.tau += Math.abs(s.omega) * dt;
    if (Math.abs(s.omega) > 0.15) s.dir += (Math.sign(s.omega) - s.dir) * (1 - Math.exp(-dt * 1.8));
    s.impact *= Math.exp(-dt * 1.6);
    const flow = Math.min(1, Math.abs(s.omega) / 0.75);
    s.t += dt * 0.6 * (0.12 + 0.88 * flow * (0.4 + 0.6 * s.near));
    s.touch += (o.touch - s.touch) * (1 - Math.exp(-dt * 2.2));
    if (o.touch){
      if (s.touch < 0.05) s.touchA = o.touchA;
      else { let d = o.touchA - s.touchA; d = Math.atan2(Math.sin(d), Math.cos(d)); s.touchA += d * (1 - Math.exp(-dt * 6)); }
    }
    for (let i = 0; i < 3; i++) this.ink[i] += (this.inkT[i] - this.ink[i]) * (1 - Math.exp(-dt * 2));
  },
  u(p, name){ const k = name + (p === this.p1 ? '1' : '2'); if (!(k in this.loc)) this.loc[k] = this.gl.getUniformLocation(p, name); return this.loc[k]; },
  draw(){
    if (!this.ok) return;
    const gl = this.gl, cv = this.cv, s = this.s;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (!w || !h) return;
    if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
    const shared = (p, rw, rh) => {
      gl.uniform2f(this.u(p, 'uRes'), rw, rh);
      gl.uniform1f(this.u(p, 'uT'), s.t);
      gl.uniform1f(this.u(p, 'uTheta'), s.theta);
      gl.uniform1f(this.u(p, 'uOmega'), s.omega);
      gl.uniform1f(this.u(p, 'uImpact'), s.impact);
      gl.uniform1f(this.u(p, 'uTau'), s.tau);
      gl.uniform1f(this.u(p, 'uDir'), s.dir);
    };
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
    gl.viewport(0, 0, this.LO, this.LO);
    gl.useProgram(this.p1); shared(this.p1, this.LO, this.LO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.p2); shared(this.p2, w, h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.tex);
    gl.uniform1i(this.u(this.p2, 'uTex'), 0);
    gl.uniform1f(this.u(this.p2, 'uNear'), s.near);
    gl.uniform1f(this.u(this.p2, 'uTouch'), s.touch);
    gl.uniform1f(this.u(this.p2, 'uTouchA'), s.touchA);
    gl.uniform3f(this.u(this.p2, 'uInk'), this.ink[0], this.ink[1], this.ink[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
};

/* ---------- stage ---------- */
function updateNeighbors(){
  $('nbPrev').classList.toggle('off', !(cur > 0));
  $('nbNext').classList.toggle('off', !(cur >= 0 && cur < order.length - 1));
}
function measure(){
  const W = stage.clientWidth, H = stage.clientHeight;
  const size = Math.max(180, Math.min(W, H * 1.02, 460));
  const cv = $('liquid');
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  $('liquidFallback').style.width = $('liquidFallback').style.height = (size * 0.8) + 'px';
  D = size * 0.92;
  document.documentElement.style.setProperty('--D', size + 'px');
}
window.addEventListener('resize', measure);

/* ---------- scrubbing, inertia ---------- */
let seekTimer = null, lastSeekAt = 0, pendingExt = 0, touchA = 0.87;
function seekThrottled(t){
  const now = performance.now();
  clearTimeout(seekTimer);
  if (now - lastSeekAt > 60){ lastSeekAt = now; try{ audio.currentTime = t; }catch(e){} }
  else seekTimer = setTimeout(() => { lastSeekAt = performance.now(); try{ audio.currentTime = scrubT; }catch(e){} }, 60);
}
function scrubTo(t){
  const d = dur();
  scrubT = clamp(t, 0, d ? d - 0.05 : 0);
  engine.target = scrubT;
  if (!engine.ready() && !(track() && track().sc)) seekThrottled(scrubT);
  const delta = scrubT - scrubStart;
  $('pill').innerHTML = fmt(scrubT) + '<b>' + (delta >= 0 ? '+' : '−') + fmt(Math.abs(delta)) + '</b>';
}
function hideHint(){ if (store.get('hintSeen3', false)) return; store.set('hintSeen3', true); $('hint').style.opacity = '0'; }
function startHold(){
  if (holding){ coast = null; return; }
  const wasMotor = motorOn;
  cancelHandoff();
  holding = true; coast = null;
  resumeAfter = !audio.paused || wasMotor;
  scrubStart = scrubT = (wasMotor && engine.ready()) ? engine.pos : (audio.currentTime || 0);
  if (!audio.paused) audio.pause();
  if (engine.ensure()){
    if (!wasMotor){ engine.pos = scrubT; engine.rate = resumeAfter ? 1 : 0; }
    engine.target = scrubT; engine.mode = 'follow'; engine.gainTarget = 1;
    if (resumeAfter) engine.gain = 1;
  }
  stage.classList.add('held');
  updatePlayBtn();
}
function endHold(){
  if (!holding) return;
  holding = false; coast = null; stage.classList.remove('held');
  clearTimeout(seekTimer);
  const useEngine = engine.ready();
  if (resumeAfter){
    resumeAfter = false;
    if (useEngine){
      motorOn = true; engine.mode = 'motor';
      handoff = setTimeout(() => {
        try{ audio.currentTime = Math.min(dur(), engine.pos + 0.06); }catch(e){}
        play();
        handoff = setTimeout(() => { if (motorOn){ motorOn = false; engine.gainTarget = 0; updatePlayBtn(); } }, 1500);
      }, 140);
    } else {
      try{ audio.currentTime = scrubT; }catch(e){}
      engine.gainTarget = 0; play();
    }
  } else {
    try{ audio.currentTime = scrubT; }catch(e){}
    handoff = setTimeout(() => { handoff = null; engine.gainTarget = 0; }, 140);
  }
  updatePlayBtn(); updateMediaPos();
}
function stepCoast(dt){
  if (!holding || !coast) return;
  const v = coast.v, sv = Math.sign(v);
  coast.v = v - sv * Math.min(Math.abs(v), (Math.abs(v) * 1.6 + 3) * dt);
  const da = coast.v * dt;
  pendingExt += da;
  const before = scrubT;
  scrubTo(scrubT + da / TAU * SEC_PER_TURN);
  if (scrubT === before && da !== 0) coast.v = 0;   // hit start or end
  if (Math.abs(coast.v) < 0.35){ coast = null; endHold(); }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (holding && resumeAfter){            // the track keeps playing under the finger; turning only adds speed
    if (g && g.mode === 'disc') g.baseT += dt;
    scrubTo(scrubT + dt);
  }
  stepCoast(dt);
  const fingerOn = !!(g && g.mode === 'disc' && g.moved);
  const ext = (holding || fingerOn) ? pendingExt : null;
  pendingExt = 0;
  const rate = (motorOn && engine.ready()) ? Math.max(0, engine.rate) : 1;
  liquid.step(dt, { playing: !!track() && isPlayingUI(), rate, ext, touch: fingerOn ? 1 : 0, touchA });
  liquid.draw();
  updateProgress();
  requestAnimationFrame(frame);
}

/* ---------- gestures on the water ---------- */
let g = null;
stage.addEventListener('pointerdown', e => {
  if (!order.length || g) return;
  if (e.button !== undefined && e.button !== 0) return;
  engine.ensure();
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  const r = stage.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const dx = e.clientX - cx, dy = e.clientY - cy;
  const onDisc = Math.hypot(dx, dy) <= D / 2;
  const now = performance.now();
  g = { id: e.pointerId, mode: onDisc ? 'disc' : 'tap', x0: e.clientX, y0: e.clientY, t0: now, cx, cy, side: dx,
        moved: false, lastA: Math.atan2(dy, dx), acc: 0, tickAcc: 0, baseT: 0, samples: [{ t: now, acc: 0 }], lastMove: now, lp: null };
  if (onDisc && holding){            // caught the water while it was still running on
    coast = null; g.moved = true; g.baseT = scrubT;
  } else if (!onDisc && holding){
    endHold();
  } else if (onDisc){
    g.lp = setTimeout(() => { if (g && !g.moved) stage.classList.add('lp'); }, 550);
  }
});
stage.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.id || g.mode !== 'disc') return;
  const mx = e.clientX - g.x0, my = e.clientY - g.y0;
  if (!g.moved && Math.hypot(mx, my) > 6){
    g.moved = true; clearTimeout(g.lp); stage.classList.remove('lp');
    startHold(); g.baseT = scrubT;
  }
  if (!g.moved) return;
  const dx = e.clientX - g.cx, dy = e.clientY - g.cy;
  const a = Math.atan2(dy, dx);
  touchA = Math.atan2(-dy, -dx);
  if (Math.hypot(dx, dy) > 16){
    let da = a - g.lastA;
    if (da > Math.PI) da -= TAU; else if (da < -Math.PI) da += TAU;
    g.acc += da;
    pendingExt += da;
    g.tickAcc += Math.abs(da);
    if (g.tickAcc >= TICK_ANGLE){ g.tickAcc %= TICK_ANGLE; tick(); }
    const want = g.baseT + g.acc / TAU * SEC_PER_TURN;
    scrubTo(want);
    if (scrubT !== want) g.baseT = scrubT - g.acc / TAU * SEC_PER_TURN;   // don't wind up past the ends
    const now = performance.now();
    g.samples.push({ t: now, acc: g.acc });
    while (g.samples.length > 2 && now - g.samples[0].t > 110) g.samples.shift();
    g.lastMove = now;
  }
  g.lastA = a;
});
function finish(e, cancelled){
  if (!g || e.pointerId !== g.id) return;
  const gg = g; g = null;
  clearTimeout(gg.lp); stage.classList.remove('lp');
  const now = performance.now(), mx = e.clientX - gg.x0, my = e.clientY - gg.y0;
  if (gg.mode === 'disc'){
    if (!gg.moved){
      if (!cancelled){ if (now - gg.t0 > 550) pickCover(currentId); else { tick(); togglePlay(); } }
    } else {
      let v = 0;
      if (!cancelled && now - gg.lastMove < 60 && gg.samples.length > 1){
        const s0 = gg.samples[0], dts = (now - s0.t) / 1000;
        if (dts > 0.015) v = (gg.acc - s0.acc) / dts;
      }
      if (holding && Math.abs(v) > 2.5) coast = { v: clamp(v, -45, 45) };
      else endHold();
      if (Math.abs(gg.acc) > 0.5) hideHint();
    }
  } else if (!cancelled && Math.hypot(mx, my) < 14){
    const pl = isPlayingUI();
    if (gg.side > D / 2){ tick(); go(cur + 1, pl); }
    else if (gg.side < -D / 2){ tick(); go(cur - 1, pl); }
  }
}

function fromName(name, tags){
  const base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();

}

/* ---------- SoundCloud ----------
   Everything goes through our small server (Cloudflare Worker), which keeps the secret key.
   The library keeps only what describes a track (title, author, link, artwork address);
   the sound itself is never stored, and SoundCloud tracks are never sped up or reversed. */
const SC_WORKER = 'https://plastinki-token.tros98799.workers.dev';
const HLS_JS = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
let hls = null, scLoadToken = 0, scRetry = 0, scPendingPlay = false, scWanted = false;

async function scFetch(path, params){
  const q = new URLSearchParams(params).toString();
  let res;
  try{ res = await fetch(SC_WORKER + path + (q ? '?' + q : ''), { headers: { accept: 'application/json' } }); }
  catch(e){ throw new Error('net'); }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if (!res.ok) throw new Error((data && data.error) || ('http ' + res.status));
  return data;
}
const scApi = path => scFetch('/api', { path });
function scError(e){
  if (e && e.message === 'net') return 'Нет связи с SoundCloud. Включён ли VPN?';
  if (e && e.message === 'no-stream') return 'SoundCloud не отдаёт этот трек для прослушивания';
  return 'SoundCloud не ответил, попробуй ещё раз';
}
function artBig(u){ return u ? u.replace('-large.', '-t500x500.') : null; }
function fromSC(tr){
  const user = (tr.user && tr.user.username) || '';
  return {
    id: 'sc-' + tr.id,
    title: tr.title || 'Без названия',
    artist: user,
    sc: { urn: tr.urn || ('soundcloud:tracks:' + tr.id), link: tr.permalink_url, user, userLink: tr.user && tr.user.permalink_url, access: tr.access || 'playable' },
    artUrl: artBig(tr.artwork_url || (tr.user && tr.user.avatar_url) || ''),
    blob: null, cover: null, color: null,
    duration: (tr.duration || 0) / 1000,
    hue: hueOf(tr.title + user),
    added: Date.now()
  };
}
function playableSC(tr){ return tr && tr.kind !== 'playlist' && (tr.access || 'playable') === 'playable' && tr.streamable !== false; }

// artwork colour: only works if the image host allows the browser to read the picture
function colorOfUrl(url){
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => { try{ res(dominantColor(im)); }catch(e){ res(null); } };
    im.onerror = () => res(null);
    im.src = url;
  });
}

function loadScriptOnce(src){
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return window.Hls ? res() : setTimeout(res, 300);
    const s = document.createElement('script'); s.src = src; s.dataset.src = src;
    s.onload = res; s.onerror = rej; document.head.append(s);
  });
}
function dropHls(){ if (hls){ try{ hls.destroy(); }catch(e){} hls = null; } }

async function attachStream(url, format){
  dropHls();
  if (format === 'hls' && !audio.canPlayType('application/vnd.apple.mpegurl')){
    try{
      await loadScriptOnce(HLS_JS);
      if (window.Hls && window.Hls.isSupported()){
        hls = new window.Hls({ enableWorker: true });
        hls.on(window.Hls.Events.ERROR, (ev, d) => {
          if (!d || !d.fatal) return;
          const t = track();
          if (t && t.sc && scRetry === 0){ scRetry++; loadSC(t, scWanted, audio.currentTime || 0); }
          else toast('Поток SoundCloud оборвался');
        });
        hls.loadSource(url); hls.attachMedia(audio);
        return;
      }
    }catch(e){}
  }
  audio.src = url;
}

// called by loadCurrent for SoundCloud tracks
async function loadSC(t, autoplay, resumeAt){
  const my = ++scLoadToken;
  $('artist').dataset.loading = '1';
  try{
    const s = await scFetch('/stream', { urn: t.sc.urn });
    if (my !== scLoadToken || currentId !== t.id) return;
    await attachStream(s.url, s.format);
    if (my !== scLoadToken || currentId !== t.id) return;
    if (s.preview) toast('SoundCloud отдал только отрывок этого трека');
    if (resumeAt) pendingSeek = { id: t.id, t: resumeAt };
    if (autoplay || scPendingPlay) play();
    scPendingPlay = false;
  }catch(e){
    scPendingPlay = false;
    if (my === scLoadToken) toast(scError(e));
  }finally{
    if (my === scLoadToken) delete $('artist').dataset.loading;
  }
}
// stream addresses expire after a while: on an error, fetch a fresh one once and carry on
audio.addEventListener('error', () => {
  const t = track();
  if (!t || !t.sc || currentId !== t.id || scRetry > 0 || (!audio.currentSrc && !hls)) return;
  scRetry++;
  loadSC(t, scWanted, audio.currentTime || 0);
});
audio.addEventListener('playing', () => { scRetry = 0; scWanted = true; });
audio.addEventListener('pause', () => { if (!audio.error) scWanted = false; });

async function addSCTracks(list){
  const fresh = [];
  for (const tr of list){
    if (!playableSC(tr)) continue;
    const t = fromSC(tr);
    if (byId(t.id) || fresh.some(x => x.id === t.id)) continue;
    t.added = Date.now() + fresh.length;
    fresh.push(t);
  }
  if (!fresh.length) return 0;
  const demoPlaying = !!track()?.demo;
  if (demoPlaying){ abortScrub(); audio.pause(); currentId = null; }
  library = library.filter(t => !t.demo).concat(fresh);
  for (const t of fresh) await DB.put(strip(t));
  const keep = (currentId && byId(currentId)) ? currentId : fresh[0].id;
  rebuildOrder(keep);
  updateNeighbors(); loadCurrent(false); renderQueue();
  // artwork colours in the background
  for (const t of fresh){
    colorOfUrl(t.artUrl).then(c => { if (c){ t.color = c; DB.put(strip(t)); if (t.id === currentId) applyTheme(t); } });
  }
  return fresh.length;
}

setInterval(() => { const t = track(); if (t && !t.demo && !holding) store.set('pos', { id: t.id, t: audio.currentTime || 0 }); }, 3000);

/* ---------- boot ---------- */
(async () => {
  measure();
  shuffle = store.get('shuffle', false); repeat = store.get('repeat', false);
  $('shuffleBtn').setAttribute('aria-pressed', shuffle); $('repeatBtn').setAttribute('aria-pressed', repeat);
  if (store.get('hintSeen3', false)) $('hint').style.opacity = '0';
  if (!liquid.init($('liquid'))){ $('liquid').hidden = true; $('liquidFallback').hidden = false; }
  updatePlayBtn();
  await DB.open();
  const rows = await DB.all();
  rows.sort((a, b) => a.added - b.added);
  library = rows.map(hydrate);
  let keep = null;
  if (!library.length){ library = makeDemos(); keep = 'demo1'; }
  else {
    const pos = store.get('pos', null);
    if (pos && library.some(t => t.id === pos.id)){ keep = pos.id; pendingSeek = pos; }
    else keep = library[0].id;
  }
  rebuildOrder(keep);
  loadCurrent(false);
  renderQueue();
  measure();
  requestAnimationFrame(t => { last = t; frame(t); });
  // older saved tracks: work out a background colour from their cover
  for (const t of library){
    if (!t.cover && t.artUrl && !t.color){ colorOfUrl(t.artUrl).then(c => { if (c){ t.color = c; DB.put(strip(t)); if (t.id === currentId) applyTheme(t); } }); continue; }
    if (t.cover && !t.color && !t.demo){
      try{ t.color = await colorOfBlob(t.cover); DB.put(strip(t)); if (t.id === currentId) applyTheme(t); }catch(e){}
    }
  }
})();
})();
</script>
